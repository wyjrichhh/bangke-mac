patch:
  # 改用扩展词库(雾凇 rime-ice 核心全拼分片),只换词库不换 schema。
  # 词典定义见随包分发的 luna_pinyin.extended.dict.yaml(由 postinstall
  # 连同 cn_dicts/ 分片一起铺到用户 ~/Library/Rime/)。词源 iDvel/rime-ice。
  translator/dictionary: luna_pinyin.extended

  # 覆盖官方 recognizer/patterns/uppercase。原 [A-Z][-_+.'0-9A-Za-z]*$ 会把
  # 「大写开头 + 后续小写」整串贪婪匹配成一个 uppercase 段(如 IBMbiru 整个被吞),
  # 而 uppercase 段没有 translator → 大写英文后的拼音完全无候选(既无 librime 也无 AI)。
  # 去掉 [a-z] 后, 纯大写缩写(IBM/SSO)仍是独立 raw 段, 后续小写拼音切回 abc 段正常推理。
  recognizer/patterns/uppercase: "[A-Z][-_+.'0-9A-Z]*$"

  # 简繁方向与官方相反。@2 是朙月拼音的字形开关。官方词库存繁体,filters 挂
  # t2s/t2hk/t2tw(繁→简/港/台);这里换成了 rime-ice 的简体分片,繁体字在表里
  # 根本没有码,那套链就只是空转 —— 「傳統漢字」档会直接吐出简体。改用
  # s2t/s2hk/s2tw 后表固定为简体,繁体只在输出时转,四态含义随之变成
  # [简体, 繁體, 香港字形, 臺灣字形]。
  switches/@2/options: [ zh_hans, zh_hant, zh_hant_hk, zh_hant_tw ]
  switches/@2/states: [ 简化字, 繁體, 香港字形, 臺灣字形 ]
  switches/@2/abbrev: [ 简, 繁, 港, 臺 ]
  # 默认落 index 0 = 简体,与简体训练的 CT2 模型对齐
  switches/@2/reset: 0

  # translators 必须整列重写: ai_predict_translator 要排在 **首位**,否则
  # MergedTranslation::Elect 不会先问它(见插件 CLAUDE.md)。Rime 的 list patch
  # 没有"插入到第 0 位"语法,所以这里把朙月拼音原生的四个 translator 完整列出,
  # 再在最前面加 ai_predict_translator —— 不能只 append,那样原生的
  # custom_phrase / reverse_lookup 会被丢掉。
  engine/translators:
    - ai_predict_translator       # MUST be first
    - punct_translator
    - table_translator@custom_phrase
    - reverse_lookup_translator
    - script_translator

  # filters 必须整列重写: 简体档不挂转换器(表原生就是简体),繁体三档各挂一个
  # s2* 转换器。清单等于改动前的最终顺序 —— emoji 在最前,ai_predict_filter 在
  # 最后,简繁链夹在中间。
  engine/filters:
    - simplifier@emoji            # 中文词转 emoji, 须排在简繁转换之前
    - simplifier@zh_hant
    - simplifier@zh_hant_hk
    - simplifier@zh_hant_tw
    - uniquifier
    - ai_predict_filter

  # option_name 不写会默认监听 "simplification"(新版 schema 已无此开关),转换器
  # 于是永不触发: 开关显示"繁體"、实际却输出简体。必须显式绑定同名选项。
  # s2* 数据随 rime-ice 的 opencc/ 一并铺到 ~/Library/Rime/opencc/。
  zh_hant:
    option_name: zh_hant
    opencc_config: s2t.json
    tips: none
    excluded_types: [ reverse_lookup ]

  zh_hant_hk:
    option_name: zh_hant_hk
    opencc_config: s2hk.json
    tips: none
    excluded_types: [ reverse_lookup ]

  zh_hant_tw:
    option_name: zh_hant_tw
    opencc_config: s2tw.json
    tips: none
    excluded_types: [ reverse_lookup ]

  switches/@next:
    name: emoji
    states: [ 💀, 😄 ]
    reset: 1

  # 关键: option_name 不写会默认监听 "simplification", 新版 schema 已无此开关
  # → 转换器永不触发。显式绑定到上面 switches 里新增的 emoji 开关。
  emoji:
    option_name: emoji
    opencc_config: emoji.json
    inherit_comment: false

  ai_predict:
    model_path: predict_models/zh-base-ct2-int8
    min_input_length: 12
    min_context_prompt_length: 2
    # 记录数上限，用于从前端拿不到真文本时的 commit_history 回退路径
    context_window_size: 10
    # 真文本窗口的字符数上限（前端恒定读 64，在这里截断）。数字比现有
    # commit_history 窗口（实测 10-25 字）略宽；调大会增加推理耗时。
    context_window_chars: 24
    # 关掉则一律走 commit_history 重建，等于本特性上线前的行为
    use_frontend_context: true
    debounce_ms: 200
    max_tokens: 64
    device: cpu
    target_index: 1
    search_range: 10
    min_hanzi: 2
    # 是否剥掉模型输出里的标点。默认 true 与上线前行为一致；关掉可保留
    # 模型吐出的句读（如「，我们」），代价是上下文复读的标点残留也会进候选。
    filter_punctuation: true
    # 纯推理模式：候选只来自模型，词库词不参与，候选栏只剩一条不带序号的预测。
    # 关掉即回到「词库 + AI」的混合候选。
    ai_only: false
